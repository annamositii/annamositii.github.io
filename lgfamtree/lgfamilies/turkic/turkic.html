<!DOCTYPE html>
<html>
<head>
    <title>Turkic Languages</title>
    <link rel="stylesheet" href="../../tree.css">
</head>

<body>
<div id="coordinates">X: 0 | Y: 0</div>
    <svg id="canvas" viewBox="-5000 -5000 10000 10000">
        <a href="../../FamilyTree.html">
            <text x="0" y="-4000" class="tree-heading" text-anchor="middle">
                    Turkic Languages
            </text>
        </a>
        
        <text x="0" y="-3000" class="language-node popover-trigger" text-anchor="middle" data-title="Proto-Turkic">
            Proto-Turkic!
        </text>
        <polyline
            points="0, -2800 
            0, -2500 
            -1800, -2500 
            -1800, -2200"
            class="branch"/>
        <text x="-1800" y="-2000" class="family-node popover-trigger" text-anchor="middle" data-title="Common Turkic">
            Common Turkic
        </text>
        <polyline
            points="
            0, -2500 
            1800, -2500 
            1800, -2200"
            class="branch"/>
        <text x="1800" y="-2000" class="family-node popover-trigger" text-anchor="middle" data-title="Oghuric">
            Oghuric!
        </text>

    </svg>
    <div id="popover"></div> 


<script src="../../tree.js"></script>
</body>

</html>
